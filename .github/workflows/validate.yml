name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.29'
          enable-cache: true
      - name: Select validation scope
        id: scope
        run: uv run --locked scripts/ci_validate.py select
      - name: Validate document snapshot
        run: uv run --locked scripts/ci_validate.py documents
      - name: Run full test suite
        if: steps.scope.outputs.full_tests == 'true'
        run: uv run --locked -m unittest discover -s tests -v
      - run: git diff --exit-code
      - run: git diff --check
